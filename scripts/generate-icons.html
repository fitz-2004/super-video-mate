<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <h2>生成 Learning Mate 图标</h2>
  <p>在浏览器中打开此文件，右键点击图标保存为 PNG</p>

  <div style="margin: 20px 0;">
    <h3>16x16</h3>
    <canvas id="icon16" width="16" height="16" style="border: 1px solid #ccc; image-rendering: pixelated; width: 128px; height: 128px;"></canvas>
  </div>

  <div style="margin: 20px 0;">
    <h3>48x48</h3>
    <canvas id="icon48" width="48" height="48" style="border: 1px solid #ccc; width: 192px; height: 192px;"></canvas>
  </div>

  <div style="margin: 20px 0;">
    <h3>128x128</h3>
    <canvas id="icon128" width="128" height="128" style="border: 1px solid #ccc;"></canvas>
  </div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;

      // 背景渐变
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      // 绘制书本图标
      ctx.fillStyle = 'white';
      const bookWidth = size * 0.6;
      const bookHeight = size * 0.5;
      const bookX = (size - bookWidth) / 2;
      const bookY = (size - bookHeight) / 2;

      // 书本主体
      ctx.fillRect(bookX, bookY, bookWidth, bookHeight);

      // 书脊
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fillRect(bookX + bookWidth * 0.45, bookY, bookWidth * 0.1, bookHeight);

      // AI 小星星
      ctx.fillStyle = '#FFD700';
      const starSize = size * 0.15;
      const starX = bookX + bookWidth * 0.8;
      const starY = bookY - starSize * 0.5;
      ctx.beginPath();
      ctx.arc(starX, starY, starSize, 0, Math.PI * 2);
      ctx.fill();
    }

    drawIcon(document.getElementById('icon16'));
    drawIcon(document.getElementById('icon48'));
    drawIcon(document.getElementById('icon128'));

    // 自动下载功能
    document.querySelectorAll('canvas').forEach(canvas => {
      canvas.addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = canvas.id + '.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    });
  </script>
</body>
</html>
